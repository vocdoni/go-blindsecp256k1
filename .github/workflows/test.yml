name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Run tests
      run: go test -race -cover $(go list ./... | grep -v /wasm)
    - name: Run tests without cgo (pure Go proof)
      run: CGO_ENABLED=0 go test $(go list ./... | grep -v /wasm)
    - name: Build wasm
      run: GOOS=js GOARCH=wasm go build -o /dev/null ./wasm
  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.x
    # scan the root package only: ./wasm needs GOOS=js and holds no
    # production code beyond thin bindings to the root package
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck .
