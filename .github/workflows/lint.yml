name: Lint
on: [ push, pull_request ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      # the wasm package only builds with GOOS=js and can't be typechecked here
      - name: Remove wasm package
        run: rm -r wasm
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
